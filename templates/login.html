{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="login-container">
    <div class="login-card">
        <div class="logo-area">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Organization Logo">
        </div>

        <form action="{{ url_for('login') }}" method="POST" id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="login-button">Log In</button>

            <div class="form-footer">
                <a href="{ url_for('forgot_password') }}">Forgot your password?</a>
            </div>
        </form>
    </div>

    <div class="extra-links">
        <a href="#">System Check</a> | <a href="#">Support</a>
    </div>
</div>
{% endblock %}
